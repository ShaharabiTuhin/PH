<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <style>  
        .left{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 35%;
            height: 576px;
            border-radius: 5px;
            background-color: rgba(151, 151, 151, 0.52);
        }
        .right{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75%;
            height: 576px;
            border-radius: 5px;
            background-color: rgb(209, 204, 61);
        }
        .responsive{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            border-radius: 5px;
            padding: 5px;
            gap: 5px;
        }
        @media screen and (max-width: 576px) {
            .responsive{
                flex-wrap: wrap;
            }
            .left{
                width: 100%;
                height: 192px;
            }
            .right{
                width: 100%;
                height: 384px;
            }     
        }
    </style>
</head>
<body>
    <section class="responsive">
        <div class="left">Left</div>
        <div class="right">Right</div>
    </section>
</body>
</html>
