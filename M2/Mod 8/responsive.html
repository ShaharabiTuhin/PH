<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <style>
        body{
            border: 1px solid tomato;
        }
        .image-container{
            display: flex;
        }
        .image-container div{
            width: 50%;
        }
        .image-container img{
            width: 100%;
        }
        @media screen and (max-width: 567px){
            .image-container{
                flex-direction: column-reverse;
            }     
            .image-container div{
            width: 100%;
        }       
        }
    </style>
</head>
<body>
    <header>
        <ol>
            <li>viewport meta tag</li>
            <li>CSS Relative Unit</li>
            <li>Body max width and horizontal center align</li>
            <li>Image Fluid</li>
            <li>two column flex and use media query with flex direction column</li>
            <li>Multi column: grid layout</li>
            <li>Menu Responsive: will need Javascript</li>
        </ol>
    </header>
    <main>
        <div class="image-container">
            <div><img src="images/food.jpg" alt=""></div>
            <div><img src="images/tiger.jpg" alt=""></div>
        </div>
    </main>
</body>
</html>
